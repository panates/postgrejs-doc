# pnpm's default holds back any version published in the last 1440 minutes (24 hours). Off here:
# a fresh release is installable as soon as it is on the registry.
minimumReleaseAge: 0

# pnpm skips dependencies' install scripts unless approved. esbuild and workerd (via docusaurus and
# wrangler) verify their native binaries there; core-js's only prints a donation banner.
allowBuilds:
  core-js: false
  esbuild: true
  workerd: true
